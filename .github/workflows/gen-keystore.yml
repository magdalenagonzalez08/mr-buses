name: Generate Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore mr-buses.keystore \
            -alias mrbuses -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mrbuses2026 -keypass mrbuses2026 \
            -dname "CN=MR Buses, OU=Personal, O=MR, L=Chiriqui, ST=Chiriqui, PA"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: mr-buses.keystore
